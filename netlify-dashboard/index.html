<!DOCTYPE html>
<html lang="th">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
    
    <style>
        * {
            font-family: 'Inter', 'Noto Sans Thai', sans-serif;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0ea5e9 100%);
        }
        
        .solar-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
        }
        
        .animate-pulse-slow {
            animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .stat-card {
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
        }
        
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

        const GithubIcon = ({ className }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
        );

        // ========================================
        // Sample Data
        // ========================================
        
        const monthlyProductionData = [
            { month: 'ม.ค.', production: 420, target: 400, savings: 2100 },
            { month: 'ก.พ.', production: 480, target: 450, savings: 2400 },
            { month: 'มี.ค.', production: 550, target: 500, savings: 2750 },
            { month: 'เม.ย.', production: 620, target: 580, savings: 3100 },
            { month: 'พ.ค.', production: 580, target: 550, savings: 2900 },
            { month: 'มิ.ย.', production: 510, target: 480, savings: 2550 },
            { month: 'ก.ค.', production: 490, target: 460, savings: 2450 },
            { month: 'ส.ค.', production: 520, target: 490, savings: 2600 },
            { month: 'ก.ย.', production: 480, target: 450, savings: 2400 },
            { month: 'ต.ค.', production: 450, target: 420, savings: 2250 },
            { month: 'พ.ย.', production: 430, target: 400, savings: 2150 },
            { month: 'ธ.ค.', production: 400, target: 380, savings: 2000 },

        const hourlyData = [
            { hour: '06:00', power: 0.2, irradiance: 50 },
            { hour: '07:00', power: 0.8, irradiance: 150 },
            { hour: '08:00', power: 1.8, irradiance: 350 },

            { hour: '10:00', power: 4.1, irradiance: 720 },
            { hour: '11:00', power: 4.6, irradiance: 850 },

            { hour: '17:00', power: 1.2, irradiance: 250 },
            { hour: '18:00', power: 0.3, irradiance: 80 },
        ];
        
        const roiData = [
            { year: 'ปี 1', cumulative: -85000, savings: 15000 },
            { year: 'ปี 2', cumulative: -55000, savings: 30000 },
            { year: 'ปี 3', cumulative: -25000, savings: 30000 },
            { year: 'ปี 4', cumulative: 5000, savings: 30000 },
            { year: 'ปี 5', cumulative: 35000, savings: 30000 },
        ];
        
        const energyMixData = [
            { name: 'Solar', value: 65, color: '#fbbf24' },
            { name: 'Grid', value: 25, color: '#3b82f6' },
            { name: 'Battery', value: 10, color: '#10b981' },
        ];
        
        // ========================================
        // Stat Card Component
        // ========================================
        
        const StatCard = ({ title, value, unit, change, changeType, icon: Icon, color, subtext }) => {
            const colorClasses = {
                yellow: 'from-amber-400 to-yellow-500',
                blue: 'from-blue-400 to-blue-600',
                green: 'from-emerald-400 to-green-600',
                purple: 'from-purple-400 to-purple-600',
                orange: 'from-orange-400 to-orange-600',
            };
            
            return (
                <div className="glass-card rounded-2xl p-6 stat-card">
                    <div className="flex items-start justify-between">
                        <div className="flex-1">
                            <p className="text-slate-500 text-sm font-medium mb-1">{title}</p>
                            <div className="flex items-baseline gap-2">
                                <span className="text-3xl font-bold text-slate-800">{value}</span>
                                <span className="text-slate-500 text-sm">{unit}</span>
                            </div>
                            {change && (
                                <div className={`flex items-center gap-1 mt-2 text-sm ${changeType === 'up' ? 'text-emerald-600' : 'text-red-500'}`}>

                                    <span>{change}</span>
                                </div>
                            )}
                            {subtext && <p className="text-slate-400 text-xs mt-2">{subtext}</p>}
                        </div>
                        <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${colorClasses[color]} flex items-center justify-center shadow-lg`}>
                            <Icon className="w-7 h-7 text-white" />
                        </div>
                    </div>
                </div>
            );
        };
        
        // ========================================
        // Chart Card Component
        // ========================================
        
        const ChartCard = ({ title, subtitle, children, className = '' }) => (
            <div className={`glass-card rounded-2xl p-6 ${className}`}>
                <div className="mb-4">
                    <h3 className="text-lg font-semibold text-slate-800">{title}</h3>
                    {subtitle && <p className="text-slate-500 text-sm">{subtitle}</p>}
                </div>
                {children}
            </div>
        );
        
        // ========================================
        // Progress Ring Component
        // ========================================
        
        const ProgressRing = ({ progress, size = 120, strokeWidth = 10, color = '#fbbf24' }) => {
            const radius = (size - strokeWidth) / 2;
            const circumference = radius * 2 * Math.PI;
            const offset = circumference - (progress / 100) * circumference;
            
            return (
                <div className="relative" style={{ width: size, height: size }}>
                    <svg className="transform -rotate-90" width={size} height={size}>
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke="#e2e8f0"
                            strokeWidth={strokeWidth}
                            fill="none"
                        />
                        <circle
                            cx={size / 2}
                            cy={size / 2}
                            r={radius}
                            stroke={color}
                            strokeWidth={strokeWidth}
                            fill="none"
                            strokeDasharray={circumference}
                            strokeDashoffset={offset}
                            strokeLinecap="round"
                            className="transition-all duration-1000 ease-out"
                        />
                    </svg>
                    <div className="absolute inset-0 flex items-center justify-center">
                        <span className="text-2xl font-bold text-slate-800">{progress}%</span>
                    </div>
                </div>
            );
        };
        
        // ========================================

        // ========================================
        
        const LiveStatus = ({ status, lastUpdate }) => (

        // ========================================
        // Weather Widget Component
        // ========================================
        
        const WeatherWidget = () => (
            <div className="glass-card rounded-2xl p-6">

                    <h3 className="text-lg font-semibold text-slate-800">สภาพอากาศ</h3>

                    </div>
                    <div>

                    </div>

                        <div className="text-slate-500 text-xs mb-1">ความชื้น</div>
                        <div className="font-semibold text-slate-700">45%</div>
                    </div>
                    <div className="text-center">
                        <div className="text-slate-500 text-xs mb-1">UV Index</div>
                        <div className="font-semibold text-slate-700">8</div>
                    </div>
                    <div className="text-center">
                        <div className="text-slate-500 text-xs mb-1">เมฆ</div>
                        <div className="font-semibold text-slate-700">15%</div>
                    </div>
                </div>
            </div>

        // ========================================
        // System Health Component
        // ========================================
        
        const SystemHealth = () => {
            const systems = [
                { name: 'แผงโซลาร์', status: 'normal', value: '98%' },
                { name: 'อินเวอร์เตอร์', status: 'normal', value: '100%' },
                { name: 'แบตเตอรี่', status: 'warning', value: '75%' },
                { name: 'การเชื่อมต่อ', status: 'normal', value: 'Online' },
            ];
            
            const statusColors = {
                normal: 'bg-emerald-500',
                warning: 'bg-amber-500',
                error: 'bg-red-500',
            };
            
            return (
                <div className="glass-card rounded-2xl p-6">
                    <h3 className="text-lg font-semibold text-slate-800 mb-4">สถานะระบบ</h3>
                    <div className="space-y-4">
                        {systems.map((system, index) => (
                            <div key={index} className="flex items-center justify-between">
                                <div className="flex items-center gap-3">

                                </div>
                                <span className="font-medium text-slate-800">{system.value}</span>
                            </div>

        // ========================================
        // Quick Actions Component
        // ========================================
        
        const QuickActions = () => {
            const actions = [
                { icon: CalendarIcon, label: 'รายงาน', color: 'bg-blue-500' },
                { icon: SettingsIcon, label: 'ตั้งค่า', color: 'bg-slate-500' },
                { icon: CalculatorIcon, label: 'คำนวณ', color: 'bg-amber-500' },
                { icon: LeafIcon, label: 'CO₂', color: 'bg-emerald-500' },
            ];
            
            return (
                <div className="glass-card rounded-2xl p-6">
                    <h3 className="text-lg font-semibold text-slate-800 mb-4">การดำเนินการ</h3>
                    <div className="grid grid-cols-2 gap-3">
                        {actions.map((action, index) => (
                            <button
                                key={index}
                                className="flex flex-col items-center gap-2 p-4 rounded-xl bg-slate-50 hover:bg-slate-100 transition-colors cursor-pointer"
                            >
                                <div className={`w-10 h-10 rounded-lg ${action.color} flex items-center justify-center`}>
                                    <action.icon className="w-5 h-5 text-white" />
                                </div>
                                <span className="text-sm font-medium text-slate-700">{action.label}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };
        
        // ========================================
        // Alerts Component
        // ========================================
        
        const AlertsPanel = () => {
            const alerts = [

        const LocationSearch = ({ onLocationSelect, selectedLocation, onClear }) => {
            const [query, setQuery] = useState('');

            const [showResults, setShowResults] = useState(false);
            const [gettingLocation, setGettingLocation] = useState(false);
            const searchTimeout = React.useRef(null);
            
            const searchLocation = async (searchQuery) => {
                if (searchQuery.length < 2) {
                    setResults([]);
                    setShowResults(false);
                    return;
                }
                
                setIsLoading(true);
                setShowResults(true);
                
                try {
                    // ค้นหาทั้งในไทยและทั่วโลก เพิ่มจำนวนผลลัพธ์
                    const searchWithTH = `${searchQuery} ประเทศไทย`;
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchWithTH)}&limit=10&addressdetails=1&accept-language=th`;
                    const response = await fetch(url, {
                        headers: { 'User-Agent': 'SolarDashboard/1.0' }
                    });
                    let data = await response.json();
                    
                    // ถ้าไม่เจอ ลองค้นหาแบบไม่มี "ประเทศไทย"
                    if (data.length === 0) {
                        const url2 = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=10&addressdetails=1&accept-language=th`;
                        const response2 = await fetch(url2, {
                            headers: { 'User-Agent': 'SolarDashboard/1.0' }
                        });
                        data = await response2.json();
                    }
                    
                    setResults(data);
                } catch (error) {
                    console.error('Search error:', error);
                    setResults([]);
                } finally {
                    setIsLoading(false);
                }
            };
            
            const handleInputChange = (e) => {
                const value = e.target.value;
                setQuery(value);
                
                if (searchTimeout.current) {
                    clearTimeout(searchTimeout.current);
                }
                
                searchTimeout.current = setTimeout(() => {
                    searchLocation(value);
                }, 500);
            };
            
            const formatLocationName = (result, short = false) => {
                if (short) {
                    // แบบสั้นสำหรับแสดงหลังเลือก
                    if (result.address) {
                        const parts = [];
                        if (result.address.amenity) parts.push(result.address.amenity);
                        else if (result.address.building) parts.push(result.address.building);
                        else if (result.address.village) parts.push(result.address.village);
                        if (result.address.district || result.address.city_district) {
                            parts.push(result.address.district || result.address.city_district);
                        }
                        if (result.address.state) parts.push(result.address.state);
                        if (parts.length > 0) return parts.join(', ');
                    }
                    return result.display_name.split(',').slice(0, 3).join(', ');
                }
                // แบบเต็มสำหรับแสดงในรายการค้นหา
                return result.display_name;
            };
            
            const selectResult = (result) => {
                const location = {
                    name: formatLocationName(result, true),
                    fullName: result.display_name,
                    lat: parseFloat(result.lat),
                    lon: parseFloat(result.lon)
                };
                onLocationSelect(location);
                setQuery('');
                setShowResults(false);
                setResults([]);

            const getCurrentLocation = () => {
                if (!navigator.geolocation) {
                    alert('เบราว์เซอร์ไม่รองรับ GPS');

                navigator.geolocation.getCurrentPosition(

                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        
                        try {
                            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=th`;
                            const response = await fetch(url, {
                                headers: { 'User-Agent': 'SolarDashboard/1.0' }
                            });
                            const data = await response.json();
                            const name = formatLocationName(data);
                            onLocationSelect({ name, lat, lon });
                        } catch {
                            onLocationSelect({ name: 'ตำแหน่งปัจจุบัน', lat, lon });
                        }
                        
                        setGettingLocation(false);
                    },
                    (error) => {
                        alert('ไม่สามารถหาตำแหน่งได้ กรุณาอนุญาตการเข้าถึง GPS');
                        setGettingLocation(false);
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            };
            
            return (
                <div className="relative">
                    {/* Search Box - Google Maps Style */}
                    {!selectedLocation ? (
                        <div className="relative">
                            <div className="flex items-center bg-white border border-slate-300 rounded-lg shadow-sm overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500">

                                    <SearchIcon className="w-5 h-5 text-slate-400" />
                                </div>
                                <input

                                    placeholder="ค้นหาสถานที่"
                                    className="flex-1 py-3 pr-3 text-sm text-slate-800 placeholder-slate-400 outline-none"
                                />
                                {isLoading && (
                                    <div className="pr-3">
                                        <div className="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" />
                                    </div>
                                )}
                                <button
                                    onClick={getCurrentLocation}
                                    disabled={gettingLocation}
                                    className="px-3 py-3 bg-slate-100 hover:bg-slate-200 border-l border-slate-300 transition-colors disabled:opacity-50"

                                >
                                    {gettingLocation ? (
                                        <div className="w-5 h-5 border-2 border-blue-500 border-t-transparent rounded-full animate-spin" />
                                    ) : (
                                        <CrosshairIcon className="w-5 h-5 text-slate-600" />
                                    )}
                                </button>
                            </div>
                            
                            {/* Search Results Dropdown */}
                            {showResults && (
                                <div className="absolute top-full left-0 right-0 mt-1 bg-white rounded-lg shadow-lg border border-slate-200 max-h-64 overflow-y-auto z-50">
                                    {results.length === 0 && !isLoading ? (
                                        <div className="p-3 text-sm text-slate-500 text-center">
                                            ไม่พบผลลัพธ์
                                        </div>
                                    ) : (
                                        <ul>
                                            {results.map((result, index) => (
                                                <li
                                                    key={index}
                                                    onClick={() => selectResult(result)}
                                                    className="flex items-start gap-3 px-3 py-2 hover:bg-slate-50 cursor-pointer border-b border-slate-100 last:border-0"
                                                >
                                                    <MapPinIcon className="w-4 h-4 text-red-500 mt-0.5 flex-shrink-0" />

        // ========================================
        // ROI Calculator Modal
        // ========================================
        
        const ROICalculator = ({ isOpen, onClose }) => {
            const [systemSize, setSystemSize] = useState(5);
            const [electricityPrice, setElectricityPrice] = useState(5.5);
            const [result, setResult] = useState(null);
            const [selectedLocation, setSelectedLocation] = useState(null);
            
            const calculate = () => {
                const panelCost = 30000; // บาท/kW
                const installMultiplier = 1.2;
                const capitalCost = systemSize * panelCost * installMultiplier;
                const annualProduction = systemSize * 1400; // kWh/year (Thailand average)
                const annualSavings = annualProduction * electricityPrice;
                const paybackYears = capitalCost / annualSavings;
                const roi5Years = ((annualSavings * 5 - capitalCost) / capitalCost) * 100;
                
                setResult({
                    capitalCost,
                    annualProduction,
                    annualSavings,
                    paybackYears: paybackYears.toFixed(1),
                    roi5Years: roi5Years.toFixed(1),
                    co2Reduction: (annualProduction * 0.5 / 1000).toFixed(1)
                });
            };
            
            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">

                        <div className="space-y-6">
                            <div>

                                    min="1"
                                    max="20"
                                    step="0.5"
                                    value={systemSize}
                                    onChange={(e) => setSystemSize(parseFloat(e.target.value))}
                                    className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-amber-500"
                                />
                            </div>
                            
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-2">
                                    ราคาไฟฟ้า (บาท/kWh)
                                </label>

                                    type="number"
                                    value={electricityPrice}
                                    onChange={(e) => setElectricityPrice(parseFloat(e.target.value))}
                                    className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                                    step="0.1"
                                />
                            </div>
                            
                            <button
                                onClick={calculate}
                                className="w-full py-4 bg-gradient-to-r from-amber-500 to-yellow-500 text-white font-semibold rounded-xl hover:from-amber-600 hover:to-yellow-600 transition-all shadow-lg"
                            >
                                คำนวณ
                            </button>
                            
                            {result && (
                                <div className="mt-6 p-6 bg-slate-50 rounded-2xl space-y-4">
                                    <h3 className="font-semibold text-slate-800 mb-4">ผลการคำนวณ</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <p className="text-slate-500 text-sm">ต้นทุนเริ่มต้น</p>
                                            <p className="text-xl font-bold text-slate-800">฿{result.capitalCost.toLocaleString()}</p>
                                        </div>
                                        <div>

                                            <p className="text-xl font-bold text-slate-800">{result.annualProduction.toLocaleString()} kWh</p>
                                        </div>

                                        </div>

                                            <p className="text-slate-500 text-sm">คืนทุน</p>

                                        </div>

                                        </div>
                                        <div>
                                            <p className="text-slate-500 text-sm">ลด CO₂/ปี</p>
                                            <p className="text-xl font-bold text-green-600">{result.co2Reduction} ตัน</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
        
        // ========================================
        // Main Dashboard Component
        // ========================================
        
        const SolarDashboard = () => {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [currentPower, setCurrentPower] = useState(4.2);
            const [showCalculator, setShowCalculator] = useState(false);
            
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                    setCurrentPower(prev => {
                        const change = (Math.random() - 0.5) * 0.2;
                        return Math.max(0, Math.min(5, prev + change));
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);
            
            const formatTime = (date) => {
                return date.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            };
            
            const formatDate = (date) => {
                return date.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            };
            
            return (

                                    <div className="w-12 h-12 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-xl flex items-center justify-center shadow-lg glow-effect">

                                        <div className="text-xl sm:text-2xl font-bold">{formatTime(currentTime)}</div>
                                        <div className="text-blue-200 text-sm">{formatDate(currentTime)}</div>

                            <div className="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-amber-200/30 to-yellow-300/30 rounded-full blur-3xl" />
                            <div className="relative flex flex-col lg:flex-row items-start lg:items-center justify-between gap-6">
                                <div>
                                    <p className="text-slate-500 text-lg mb-2">กำลังผลิตไฟฟ้าปัจจุบัน</p>
                                    <div className="flex items-baseline gap-3">
                                        <span className="text-5xl sm:text-7xl font-bold bg-gradient-to-r from-amber-500 to-yellow-500 bg-clip-text text-transparent">

                                        </span>
                                        <span className="text-2xl sm:text-3xl text-slate-400">kW</span>
                                    </div>
                                    <div className="flex items-center gap-2 mt-4">
                                        <div className="w-3 h-3 bg-emerald-500 rounded-full animate-pulse" />
                                        <span className="text-emerald-600 font-medium">กำลังผลิตไฟฟ้า</span>
                                        <span className="text-slate-400">| ประสิทธิภาพ 84%</span>
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row items-start sm:items-center gap-6 sm:gap-8">
                                    <ProgressRing progress={84} size={120} strokeWidth={12} color="#fbbf24" />
                                    <div className="text-left sm:text-right">
                                        <div className="mb-4">
                                            <p className="text-slate-500 text-sm">วันนี้ผลิตได้</p>
                                            <p className="text-2xl sm:text-3xl font-bold text-slate-800">24.8 <span className="text-lg text-slate-400">kWh</span></p>
                                        </div>
                                        <div>
                                            <p className="text-slate-500 text-sm">ประหยัดได้</p>
                                            <p className="text-2xl sm:text-3xl font-bold text-emerald-600">฿124 <span className="text-lg text-slate-400">วันนี้</span></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            {/* Calculator Button */}
                            <button
                                onClick={() => setShowCalculator(true)}
                                className="mt-6 px-6 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white font-semibold rounded-xl hover:from-blue-600 hover:to-blue-700 transition-all shadow-lg flex items-center gap-2"
                            >
                                <CalculatorIcon className="w-5 h-5" />

                            </button>
                        </div>
                        
                        {/* Stats Grid */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6 mb-6 sm:mb-8">

                                unit="kWh"
                                change="+12% จากเดือนก่อน"
                                changeType="up"

                                color="yellow"

                            <StatCard
                                title="ประหยัดค่าไฟ"
                                value="฿2,600"

                                changeType="up"

                            />

                                title="ลด CO₂"
                                value="312"

                            />

                                title="ROI สะสม"

                                            stroke="#94a3b8"

                                        />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </ChartCard>
                            
                            <ChartCard title="สัดส่วนพลังงาน" subtitle="แหล่งพลังงานที่ใช้">

                                    <ResponsiveContainer width="100%" height={200}>
                                        <PieChart>
                                            <Pie

                                            </Pie>
                                            <Tooltip />
                                        </PieChart>

                                    <div className="flex flex-wrap justify-center gap-4 mt-4">

                                            <div key={index} className="flex items-center gap-2">
                                                <div className="w-3 h-3 rounded-full" style={{ backgroundColor: item.color }} />
                                                <span className="text-sm text-slate-600">{item.name} {item.value}%</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </ChartCard>
                        </div>
                        
                        {/* Second Charts Row */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6 sm:mb-8">
                            <ChartCard title="การผลิตไฟฟ้ารายชั่วโมง" subtitle="วันนี้">
                                <ResponsiveContainer width="100%" height={250}>
                                    <BarChart data={hourlyData}>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                                        <XAxis dataKey="hour" stroke="#94a3b8" fontSize={11} />
                                        <YAxis stroke="#94a3b8" fontSize={11} />
                                        <Tooltip 
                                            contentStyle={{ 
                                                backgroundColor: 'white', 
                                                border: 'none', 
                                                borderRadius: '12px',
                                                boxShadow: '0 10px 40px rgba(0,0,0,0.1)'
                                            }}
                                        />
                                        <Bar 
                                            dataKey="power" 
                                            fill="#fbbf24" 
                                            radius={[4, 4, 0, 0]}
                                            name="กำลังไฟฟ้า (kW)"
                                        />
                                    </BarChart>
                                </ResponsiveContainer>
                            </ChartCard>
                            
                            <ChartCard title="ผลตอบแทนการลงทุน (ROI)" subtitle="5 ปี">
                                <ResponsiveContainer width="100%" height={250}>
                                    <AreaChart data={roiData}>
                                        <defs>
                                            <linearGradient id="colorROI" x1="0" y1="0" x2="0" y2="1">
                                                <stop offset="5%" stopColor="#10b981" stopOpacity={0.3}/>
                                                <stop offset="95%" stopColor="#10b981" stopOpacity={0}/>
                                            </linearGradient>
                                        </defs>
                                        <CartesianGrid strokeDasharray="3 3" stroke="#e2e8f0" />
                                        <XAxis dataKey="year" stroke="#94a3b8" fontSize={12} />
                                        <YAxis stroke="#94a3b8" fontSize={12} tickFormatter={(v) => `฿${v/1000}k`} />
                                        <Tooltip 
                                            contentStyle={{ 
                                                backgroundColor: 'white', 
                                                border: 'none', 
                                                borderRadius: '12px',
                                                boxShadow: '0 10px 40px rgba(0,0,0,0.1)'
                                            }}
                                            formatter={(value) => [`฿${value.toLocaleString()}`, 'กำไร/ขาดทุนสะสม']}
                                        />
                                        <Area 
                                            type="monotone" 
                                            dataKey="cumulative" 
                                            stroke="#10b981" 
                                            strokeWidth={3}
                                            fill="url(#colorROI)" 
                                        />
                                    </AreaChart>
                                </ResponsiveContainer>
                            </ChartCard>
                        </div>
                        
                        {/* Bottom Widgets */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                            <WeatherWidget />
                            <SystemHealth />
                            <QuickActions />
                            <AlertsPanel />
                        </div>

                        {/* Location Section */}
                        <div className="mt-6 sm:mt-8">
                            <div className="glass-card rounded-2xl p-6">
                                <div className="flex items-center gap-3 mb-6">
                                    <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center shadow">
                                        <MapPinIcon className="w-5 h-5 text-white" />
                                    </div>
                                    <div>
                                        <h3 className="text-lg font-semibold text-slate-800">ตำแหน่งที่ตั้ง</h3>
                                        <p className="text-slate-400 text-sm">คลิกการ์ดเพื่อดูแผนที่</p>
                                    </div>
                                </div>
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-8 py-4">
                                    <LocationMap
                                        location="โรงเรียนสุรธรรมพิทักษ์"
                                        coordinates="14.9100° N, 102.0714° E"
                                    />
                                    <div className="space-y-3 text-sm text-slate-600">
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-emerald-400" />
                                            <span>จังหวัดนครราชสีมา ประเทศไทย</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-amber-400" />
                                            <span>โซน: เขต 4 (ศักยภาพสูง)</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-blue-400" />
                                            <span>GHI เฉลี่ย: ~4.8 kWh/m²/วัน</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <div className="w-2 h-2 rounded-full bg-purple-400" />
                                            <span>ระบบ: 5 kW | ติดตั้ง: 2024</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                    
                    {/* Footer */}
                    <footer className="bg-slate-900 text-white py-8 mt-12">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6">
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-gradient-to-br from-amber-400 to-yellow-500 rounded-lg flex items-center justify-center">
                                        <SunIcon className="w-6 h-6 text-white" />
                                    </div>
                                    <div>
                                        <p className="font-semibold">Solar Analytics Dashboard</p>
                                        <p className="text-slate-400 text-sm">โรงเรียนสุรธรรมพิทักษ์</p>
                                    </div>
                                </div>
                                <div className="text-center sm:text-right text-slate-400 text-sm">
                                    <p>Powered by React, Tailwind CSS & Recharts</p>
                                    <p>© 2024 All rights reserved | Hosted on Netlify</p>
                                </div>
                            </div>
                        </div>
                    </footer>
                    
                    {/* ROI Calculator Modal */}
                    <ROICalculator isOpen={showCalculator} onClose={() => setShowCalculator(false)} />
                </div>
            );
        };
        
        // ========================================
        // Render App
        // ========================================
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SolarDashboard />);
    </script>
</body>
</html>
